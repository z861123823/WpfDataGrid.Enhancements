name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WpfDataGrid.Enhancements.sln

      - name: Build
        run: dotnet build WpfDataGrid.Enhancements.sln -c Release --no-restore

      - name: Test
        run: dotnet test WpfDataGrid.Enhancements.sln -c Release --no-build
