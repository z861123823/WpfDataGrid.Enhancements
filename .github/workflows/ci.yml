name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Open-source core library only. Demo/Tests reference the closed-source
      # Pro library and are validated in the local Pro environment.
      - name: Restore
        run: dotnet restore src/WpfDataGrid.Enhancements/WpfDataGrid.Enhancements.csproj

      - name: Build
        run: dotnet build src/WpfDataGrid.Enhancements/WpfDataGrid.Enhancements.csproj -c Release --no-restore
